<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إلى يوانا ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;

            background:
                radial-gradient(circle at top, #5c1235, transparent 45%),
                linear-gradient(135deg, #100008, #300018, #120009);

            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* =========================
           القلوب في الخلفية
        ========================= */

        .hearts {
            position: fixed;
            inset: 0;

            pointer-events: none;
            overflow: hidden;
        }

        .heart {
            position: absolute;

            bottom: -60px;

            font-size: 25px;

            opacity: 0;

            animation: floatHeart 7s linear forwards;
        }

        @keyframes floatHeart {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }


        /* =========================
           الكارت
        ========================= */

        .card {

            width: min(90%, 650px);

            padding: 50px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 30px;

            box-shadow:
                0 0 60px rgba(255, 0, 100, 0.25),
                inset 0 0 30px rgba(255, 255, 255, 0.03);

            animation: cardAppear 1.5s ease;
        }

        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           القلب الكبير
        ========================= */

        .main-heart {

            font-size: 75px;

            animation: heartbeat 1.2s infinite;

            filter: drop-shadow(0 0 15px #ff3f7f);
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }


        /* =========================
           الاسم
        ========================= */

        h1 {

            margin-top: 15px;

            font-size: 48px;

            color: #ff80aa;

            text-shadow:
                0 0 10px rgba(255, 80, 140, 0.8),
                0 0 30px rgba(255, 50, 120, 0.5);
        }

        .subtitle {

            margin-top: 10px;

            color: #ddd;

            font-size: 17px;
        }


        /* =========================
           الرسالة
        ========================= */

        .message {

            margin-top: 30px;

            min-height: 280px;

            font-size: 20px;

            line-height: 2.1;

            color: #fff;

            text-shadow: 0 0 5px rgba(255, 255, 255, 0.15);
        }

        .cursor {

            color: #ff6f9d;

            animation: blink 0.7s infinite;
        }

        @keyframes blink {

            50% {
                opacity: 0;
            }
        }


        /* =========================
           الزرار
        ========================= */

        button {

            margin-top: 20px;

            padding: 14px 35px;

            border: none;

            border-radius: 50px;

            background: linear-gradient(
                45deg,
                #ff2f72,
                #ff76a5
            );

            color: white;

            font-size: 17px;

            cursor: pointer;

            box-shadow:
                0 5px 25px rgba(255, 50, 120, 0.4);

            transition: 0.3s;
        }

        button:hover {

            transform: scale(1.08);

            box-shadow:
                0 8px 35px rgba(255, 50, 120, 0.7);
        }


        /* =========================
           التوقيع
        ========================= */

        .signature {

            margin-top: 25px;

            color: #ffabc5;

            font-size: 15px;
        }


        /* =========================
           الموبايل
        ========================= */

        @media (max-width: 600px) {

            .card {

                padding: 40px 22px;
            }

            h1 {

                font-size: 38px;
            }

            .main-heart {

                font-size: 60px;
            }

            .message {

                font-size: 17px;

                line-height: 2;
            }
        }
    </style>
</head>


<body>


    <!-- القلوب المتحركة -->

    <div class="hearts"></div>


    <!-- الكارت الرئيسي -->

    <div class="card">

        <div class="main-heart">
            ❤️
        </div>


        <h1>
            إلى يوانا
        </h1>


        <p class="subtitle">
            رسالة من قلبي ❤️
        </p>


        <!-- الرسالة -->

        <div class="message">

            <span id="text"></span>

            <span class="cursor">
                |
            </span>

        </div>


        <!-- الزرار -->

        <button onclick="showLove()">
            اضغطي هنا ❤️
        </button>


        <div class="signature">
            مهما حصل... أنا في ضهرك ❤️
        </div>

    </div>



    <script>

        /* =================================
           الرسالة
        ================================= */

        const message = `يوانا ❤️

أنا بحبك جدًا، وعايزك تعرفي إنك مش لوحدك أبدًا.

أنا جنبك وبِدعمك في كل خطوة،
وفي كل حاجة نفسك تحققيها.

مهما حصل، ومهما كانت الظروف،
هفضل في ضهرك ومش هسيبك لوحدك.

هكون جنبك في وقت فرحتك،
وفي وقت تعبك،
وفي كل لحظة محتاجة فيها حد يسندك.

عايزك دايمًا تفتكري إن في شخص
بيحبك بجد، وبيؤمن بيكي،
ونفسه يشوفك مبسوطة وناجحة دايمًا.

بحبك يا يوانا ❤️

ومهما حصل...
أنا في ضهرك. ❤️`;


        /* =================================
           الكتابة حرف حرف
        ================================= */

        let index = 0;

        const textElement = document.getElementById("text");


        function typeWriter() {

            if (index < message.length) {

                const character = message[index];


                if (character === "\n") {

                    textElement.innerHTML += "<br>";

                } else {

                    textElement.innerHTML += character;

                }


                index++;


                setTimeout(typeWriter, 45);
            }
        }


        typeWriter();



        /* =================================
           زر الحب
        ================================= */

        function showLove() {

            alert(
                "يوانا ❤️\n\n" +
                "أنا بحبك وبِدعمك،\n" +
                "ومهما حصل هفضل في ضهرك. ❤️"
            );

        }



        /* =================================
           إنشاء القلوب
        ================================= */

        function createHeart() {

            const heart = document.createElement("div");

            heart.classList.add("heart");


            const hearts = [
                "❤️",
                "💖",
                "💕",
                "💗",
                "💘",
                "💓"
            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random() * hearts.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 + "%";


            heart.style.fontSize =
                Math.random() * 20 + 15 + "px";


            heart.style.animationDuration =
                Math.random() * 4 + 5 + "s";


            document
                .querySelector(".hearts")
                .appendChild(heart);


            setTimeout(() => {

                heart.remove();

            }, 9000);

        }


        /* قلب جديد كل نصف ثانية */

        setInterval(createHeart, 500);

    </script>

</body>

</html>
